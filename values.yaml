# Default values for kuack
# This is a YAML-formatted file.

# Global settings
global:
  # Custom labels to apply to all resources
  # These labels are added to all Kubernetes objects created by this chart.
  # Useful for identifying resources in multi-tenant environments or for testing.
  # Example:
  #   labels:
  #     environment: production
  #     team: platform
  labels: {}

  # Image pull secrets applied to all components
  # Example:
  #   imagePullSecrets:
  #     - name: my-registry-secret
  imagePullSecrets: []

# Authentication configuration
auth:
  # Token for agent authentication
  # WARNING: Providing the token here as a string is not secure for production environments.
  # It is recommended to use an existing secret (auth.token.existingSecret) instead.
  token:
    # The token value. If existingSecret is not set, a secret will be created with this value.
    # Default is a well-known value for ease of use in development/demos.
    value: "kuack-demo-token"
    # Name of an existing secret containing the token.
    # The secret must have a key named "token".
    # If set, auth.token.value is ignored.
    existingSecret: ""

# Node component configuration
node:
  enabled: true
  # Image configuration
  image:
    repository: ghcr.io/kuack-io/node
    pullPolicy: IfNotPresent
    # tag defaults to "latest" if not specified
    tag: "1.3.2"
    # Optional: Use image digest instead of tag for immutability
    # Format: sha256:abc123...
    digest: ""

  # Service account configuration
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # RBAC configuration
  rbac:
    # Specifies whether RBAC resources should be created
    create: true
    # Additional ClusterRole rules
    extraRules: []

  # Cleanup behavior on `helm uninstall`
  # Helm uninstall deletes RBAC/ServiceAccount asynchronously while Pods are terminating,
  # which can prevent the node Pod from deleting its own Kubernetes Node object.
  # This optional hook job avoids that race by stopping the Deployment and deleting the Node.
  cleanupOnUninstall:
    enabled: true
    # kubectl image to run cleanup commands
    image:
      repository: public.ecr.aws/bitnami/kubectl
      tag: "1.34.0"
      pullPolicy: IfNotPresent
    # Maximum time to wait for node pods to terminate before deleting the Node anyway
    timeoutSeconds: 60

  # Node configuration
  config:
    # Name of the virtual node
    name: "kuack-node"
    # Disable the default taint on the node
    disableTaint: false

  # Logging configuration
  logging:
    # klog verbosity level (0-5)
    verbosity: 2

  # HTTP server configuration
  http:
    # Port for the public server (Agent + Registry)
    publicPort: 8080
    # Port for the internal server (Logs + Health)
    internalPort: 10250

  # ConfigMap configuration
  configMap:
    # Specifies whether a ConfigMap should be created
    create: true

  # Kubernetes client configuration
  kubeconfig:
    # Path to kubeconfig file (leave empty for in-cluster config)
    path: ""

  # Pod configuration
  pod:
    # Annotations to add to the pod
    annotations: {}
    # Labels to add to the pod
    labels: {}
    # Security context for the pod
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
    # Container security context
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    # Temporary directory for read-only filesystem
    # If readOnlyRootFilesystem is true, mount an emptyDir volume here
    tmpDir:
      enabled: true
      mountPath: /tmp

  # Resource limits and requests
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

  # Service configuration
  service:
    # Specifies whether a service should be created
    create: true
    type: ClusterIP
    # Port for HTTP server (TCP)
    httpPort: 8080
    # Port for kubelet endpoint (TCP, standard port)
    kubeletPort: 10250
    annotations: {}
    labels: {}

  # Ingress configuration
  ingress:
    # Specifies whether an ingress should be created
    create: false
    # Ingress class name (leave empty for default)
    className: ""
    # Service port to use for ingress backend (defaults to httpPort)
    port: null # null = use httpPort, or specify kubeletPort for health checks
    # Ingress annotations
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Hosts configuration
    # IMPORTANT: Node and Registry must share the same domain for CORS to work.
    # Browser agents connect to Node via WebSocket and fetch WASM from Registry.
    # Using separate domains will break due to browser CORS restrictions.
    hosts:
      - host: kuack.example.com
        paths:
          - path: /
            pathType: Prefix
    # TLS configuration
    tls: []
      # - secretName: kuack-tls
      #   hosts:
      #     - kuack.example.com
    # HTTP/HTTPS is fully supported by standard Kubernetes Ingress.

  # Pod disruption budget
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # NetworkPolicy configuration
  networkPolicy:
    # Specifies whether a NetworkPolicy should be created
    enabled: true
    # Custom ingress rules (if not specified, defaults are used)
    ingress: []
    # Custom egress rules (if not specified, all egress is allowed)
    egress: []

  # Liveness and readiness probes
  probes:
    enabled: true
    # Scheme used by health probes against the kubelet endpoint
    scheme: HTTPS

# Registry component configuration
registry:
  enabled: true
  # Image configuration
  image:
    repository: ghcr.io/kuack-io/registry
    pullPolicy: IfNotPresent
    # tag defaults to "latest" if not specified
    tag: "1.0.0"
    digest: ""

  # Valkey configuration (Redis-compatible)
  # The Valkey chart creates a service named {release}-valkey
  redis:
    addr: "kuack-valkey:6379"
    password: ""
    db: 0

  # Service account configuration
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Pod configuration
  pod:
    annotations: {}
    labels: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532 # nonroot
      fsGroup: 65532
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  # Replicas
  replicas: 1

  # Service configuration
  service:
    create: true
    type: ClusterIP
    port: 8080
    annotations: {}
    labels: {}

  # NetworkPolicy configuration
  networkPolicy:
    # Specifies whether a NetworkPolicy should be created
    enabled: true
    # Custom ingress rules (if not specified, defaults allow same namespace)
    ingress: []
    # Custom egress rules (if not specified, defaults allow Valkey and external HTTPS)
    egress: []

  # Probes
  probes:
    enabled: true
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5

  # Ingress configuration
  ingress:
    # Specifies whether an ingress should be created
    create: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
    # IMPORTANT: Must use the same domain as Node ingress for CORS to work.
    # Separate Ingress resources for the same host are merged by the controller.
    hosts:
      - host: kuack.example.com
        paths:
          - path: /registry
            pathType: Prefix
    tls: []

# Valkey subchart configuration (official valkey-io/valkey-helm)
# Valkey is a Redis-compatible fork that works with go-redis client without changes.
# See registry/README.md for caching design rationale and scaling considerations.
# See helm/README.md for Valkey vs Redis explanation.
valkey:
  enabled: true
  # Use AWS ECR Public registry to avoid Docker Hub rate limiting
  image:
    registry: "public.ecr.aws"
  # Authentication configuration
  # By default, a random password is generated and stored in a Secret.
  auth:
    enabled: true
    # Use kuack's generated secret for Valkey authentication
    # This secret is auto-generated if valkey.auth.password is empty
    # checkov:skip=CKV_SECRET_6: "kuack-valkey-auth" is a reference name, not a secret
    usersExistingSecret: "kuack-valkey-auth"
    # ACL users configuration
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: "password"
  # Valkey configuration with LRU eviction
  # When maxmemory is reached, Valkey evicts least-recently-used keys automatically.
  # This prevents OOM while keeping popular images cached.
  valkeyConfig: |
    maxmemory 2gb
    maxmemory-policy allkeys-lru
  resources:
    limits:
      memory: 2560Mi # ~20% headroom above maxmemory
    requests:
      memory: 256Mi

# Agent component configuration
agent:
  enabled: true
  # Image configuration
  image:
    repository: ghcr.io/kuack-io/agent
    pullPolicy: IfNotPresent
    # tag defaults to "latest" if not specified
    tag: "1.5.1"
    # Optional: Use image digest instead of tag for immutability
    # Format: sha256:abc123...
    digest: ""

  # Service account configuration
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Pod configuration
  pod:
    # Annotations to add to the pod
    annotations: {}
    # Labels to add to the pod
    labels: {}
    # Security context for the pod
    securityContext:
      runAsNonRoot: true
      runAsUser: 101 # nginx user ID
      fsGroup: 101
    # Container security context
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false # nginx needs write access for logs
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

  # Resource limits and requests
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

  # Replicas
  replicas: 1

  # Service configuration
  service:
    # Specifies whether a service should be created
    create: true
    type: ClusterIP
    # Port for HTTP server (TCP)
    port: 8080
    annotations: {}
    labels: {}

  # Ingress configuration
  ingress:
    # Specifies whether an ingress should be created
    create: false
    # Ingress class name (leave empty for default)
    className: ""
    # Ingress annotations
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Hosts configuration
    hosts:
      - host: kuack-agent.example.com
        paths:
          - path: /
            pathType: Prefix
    # TLS configuration
    tls: []
      # - secretName: kuack-agent-tls
      #   hosts:
      #     - kuack-agent.example.com

  # Pod disruption budget
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # NetworkPolicy configuration
  networkPolicy:
    # Specifies whether a NetworkPolicy should be created
    enabled: true
    # Custom ingress rules (if not specified, defaults are used)
    ingress: []
    # Custom egress rules (if not specified, all egress is allowed)
    egress: []

  # Liveness and readiness probes
  probes:
    enabled: true
    livenessProbe:
      httpGet:
        path: /
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
