{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: kuack-valkey-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Generate random password (Helm will regenerate on each install, but resource-policy:keep preserves it)
  password: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
