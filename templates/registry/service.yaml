{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuack-registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuack-registry.labels" . | nindent 4 }}
  {{- with .Values.registry.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.registry.service.type }}
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kuack-registry.selectorLabels" . | nindent 4 }}
  {{- with .Values.registry.service.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
