{{- if and .Values.node.enabled .Values.node.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuack-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuack-node.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuack-node.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.node.networkPolicy.ingress }}
    {{- toYaml .Values.node.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    # Allow ingress from same namespace
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
      - protocol: TCP
        port: {{ .Values.node.service.kubeletPort }}
      - protocol: TCP
        port: {{ .Values.node.service.httpPort }}
    # Allow ingress from kube-system namespace (for kubelet communication)
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: TCP
        port: {{ .Values.node.service.kubeletPort }}
      - protocol: TCP
        port: {{ .Values.node.service.httpPort }}
    {{- end }}
  egress:
    {{- if .Values.node.networkPolicy.egress }}
    {{- toYaml .Values.node.networkPolicy.egress | nindent 4 }}
    {{- else }}
    # Allow egress to kube-apiserver (for kubelet API)
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 6443
    # Allow egress to registry (for /resolve endpoint)
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: kuack-registry
      ports:
      - protocol: TCP
        port: 8080
    # Allow DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    {{- end }}
{{- end }}
